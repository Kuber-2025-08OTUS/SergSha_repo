# injector:
#   replicas: 3

#   # Mount Path of the Vault Kubernetes Auth Method.
#   authPath: "auth/kubernetes"

global:
  enabled: true
  tlsDisable: true

server:
  replicas: 3
  # image:
  #   repository: "hashicorp/vault"
  #   tag: "1.15.0"

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "consul" {
        path = "vault"
        address = "consul-server.consul.svc:8500"
        scheme = "http"
        service = "vault"
        token = ""
      }

      service_registration "kubernetes" {}

  affinity: ""
  
ui:
  enabled: true
  # serviceType: "LoadBalancer"