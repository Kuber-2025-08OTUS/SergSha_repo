apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-secretstore
  namespace: vault
spec:
  provider:
    vault:
      server: "http://vault-active.vault.svc:8200"
      path: "otus"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "otus"
          serviceAccountRef:
            name: "vault-auth"
            namespace: "vault"
          # audiences:
          #   - "vault"
