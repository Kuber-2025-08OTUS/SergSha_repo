---
# kubeadm version -o short
- name: Get current version of kubeadm
  ansible.builtin.command: kubeadm version -o short
  register: kubeadm_version

- name: Print current version of kubeadm
  ansible.builtin.debug:
    msg: 'On {{ inventory_hostname }} current kubeadm version is {{ kubeadm_version.stdout }}'

# curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key \
# | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
- name: Adding public key for kubernetes repo
  ansible.builtin.apt_key:
    # id: 9FED2BCBDCD29CDF762678CBAED4B06F473041FA
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s.version.upgrade }}/deb/Release.key"
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

# echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] \
# https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list
- name: Adding kubernetes repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s.version.upgrade }}/deb/ /"
    state: present
    filename: /etc/apt/sources.list.d/kubernetes

# sudo apt-mark unhold kubelet kubeadm kubectl
- name: Unhold packages versions
  ansible.builtin.command: apt-mark unhold kubelet kubeadm kubectl

# sudo apt update && sudo apt install -y kubeadm='1.34.2-1.1'
- name: Upgrading kubeadm
  ansible.builtin.apt:
    name: kubeadm     #='{{ k8s.version.upgrade }}-1.1'
    state: latest
    update_cache: true

# sudo apt-mark hold kubeadm
- name: Hold packages versions
  ansible.builtin.command: apt-mark hold kubeadm

# sudo apt-cache madison kubeadm
# apt-cache madison kubeadm | grep 1.34 | head -1 | awk '{print $3}' | cut -d'-' -f1
- name: Get packages version
  ansible.builtin.shell: "apt-cache madison kubeadm | grep {{ k8s.version.upgrade }} | head -1 | awk '{print $3}' | cut -d'-' -f1"
  register: k8s_aap_version

# sudo kubeadm upgrade plan
# sudo kubeadm upgrade apply v1.34.2 -y
- name: Upgrading kubernetes cluster
  ansible.builtin.command: 'kubeadm upgrade apply v{{ k8s_aap_version.stdout }} -y'

# sudo apt install -y kubelet='1.34.2-1.1' kubectl='1.34.2-1.1' --allow-change-held-packages
- name: Upgrading kubelet kubectl
  ansible.builtin.apt:
    name: 
      - kubelet     #='{{ k8s.version.upgrade }}-1.1'
      - kubectl     #='{{ k8s.version.upgrade }}-1.1'
    state: latest
    update_cache: true

# sudo systemctl daemon-reload
# sudo systemctl restart kubelet
- name: Restarting kubelet service
  ansible.builtin.service:
    name: kubelet
    state: restarted
    enabled: true
    daemon-reload: true

# sudo apt-mark hold kubeadm
- name: Hold packages versions
  ansible.builtin.command: apt-mark hold kubelet kubectl

# kubeadm version -o short
- name: Get version of upgraded kubeadm
  ansible.builtin.command: kubeadm version -o short
  register: upgraded_kubeadm_version

- name: Print version of upgraded kubeadm
  ansible.builtin.debug:
    msg: 'On {{ inventory_hostname }} upgraded kubeadm version is {{ upgraded_kubeadm_version.stdout }}'
